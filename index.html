<body>
    <a id="skip-link" class="skip-link" href="#content-window">Pular para o conteúdo</a>
    <div class="site-shell">
        <aside id="sidebar" class="sidebar">
            <a class="brand" href="#profile" aria-label="P//SHADOW — Zipped">
                <img src="imagens/characters/black-arms.webp" width="32" height="40" alt="">
                <span>P<span class="brand-slashes">//</span>SHADOW<small>G.U.N. / PROJECT SHADOW</small></span>
            </a>
            <div class="sidebar-identity">
                <button id="profile-secret" class="avatar-button" aria-label="Zipped">
                    <img src="imagens/characters/perfil.webp" alt="Zipped" width="88" height="88" fetchpriority="high">
                    <span class="avatar-status" aria-hidden="true"></span>
                </button>
                <div><p class="identity-name">Zipped</p><p class="identity-handle">@zippedsz</p></div>
            </div>
            <nav id="main-menu" aria-label="Navegação principal"></nav>
            <div class="sidebar-bottom">
                <a id="now-playing" class="listening-card" href="https://www.last.fm/pt/user/Zippeed" target="_blank" rel="noopener noreferrer"></a>
                <section id="system-status-container" class="system-status"></section>
                <div class="sidebar-footer"><span><i class="status-dot"></i> <span id="connection-label">Online</span></span><span>G.U.N. v6.1</span></div>
            </div>
        </aside>
        <button id="mobile-overlay" class="mobile-overlay" aria-label="Fechar menu" hidden tabindex="-1"></button>
        <div class="workspace">
            <header class="topbar">
                <div class="breadcrumb"><button id="mobile-menu-toggle" class="icon-button mobile-menu-toggle" aria-label="Abrir menu" aria-controls="sidebar" aria-expanded="false"></button><span class="breadcrumb-home" id="space-label">Espaço pessoal</span><span class="breadcrumb-divider">&gt;</span><span id="section-label">Painel</span></div>
                <div class="topbar-controls">
                    <div id="lang-buttons" class="language-switch" role="group" aria-label="Idioma do site"></div>
                    <button id="effects-toggle" class="icon-button effects-toggle" aria-pressed="false" aria-label="Efeitos visuais"></button>
                    <div class="player-anchor">
                        <button id="player-toggle" class="player-toggle" aria-expanded="false" aria-controls="music-player-container"><span class="record-icon" aria-hidden="true"></span><span class="player-summary"><span id="track-name-display">Theme of Zipped</span><small id="track-state">Pausado</small></span><span id="player-toggle-icon"></span></button>
                        <section id="music-player-container" class="music-player" hidden aria-label="Trilha sonora">
                            <div class="player-panel-heading"><span id="soundtrack-label">Trilha sonora</span><span class="track-count" id="track-count">01 / 03</span></div>
                            <p id="player-track-title">Theme of Zipped</p>
                            <div class="transport"><button id="bgm-prev-btn" class="icon-button" aria-label="Faixa anterior"></button><button id="bgm-play-btn" class="icon-button play-button" aria-label="Reproduzir"></button><button id="bgm-next-btn" class="icon-button" aria-label="Próxima faixa"></button></div>
                            <div class="seek-row"><span id="elapsed">0:00</span><input id="bgm-seek" type="range" min="0" max="100" step="0.1" value="0" aria-label="Posição da música" disabled><span id="duration">0:00</span></div>
                            <div class="volume-row"><button id="bgm-mute-btn" class="icon-button" aria-label="Silenciar" aria-pressed="false"></button><input id="bgm-vol-slider" type="range" min="0" max="100" value="5" aria-label="Volume"><output id="bgm-vol-display" for="bgm-vol-slider">5%</output></div>
                            <p id="audio-message" class="audio-message" role="status"></p>
                        </section>
                    </div>
                </div>
            </header>
            <main id="main-content">
                <div class="terminal-window"><div class="window-chrome" aria-hidden="true"><span>G.U.N. DATABASE</span><span>PROJECT_SHADOW / PERSONAL_ARCHIVE</span></div><div id="content-window" tabindex="-1"></div></div>
                <footer class="page-footer"><span id="footer-text">Feito para explorar no seu ritmo.</span><span>P<span class="brand-slashes">//</span>SHADOW</span></footer>
            </main>
        </div>
    </div>
    <dialog id="lightbox" class="lightbox" aria-labelledby="lightbox-caption">
        <button id="lightbox-close" class="icon-button lightbox-close" aria-label="Fechar"></button>
        <button id="lightbox-prev" class="icon-button lightbox-prev" aria-label="Imagem anterior"></button>
        <figure><img id="lightbox-img" alt=""><figcaption id="lightbox-caption"></figcaption><p id="lightbox-error" role="status" hidden></p></figure>
        <button id="lightbox-next" class="icon-button lightbox-next" aria-label="Próxima imagem"></button>
        <span id="lightbox-count" class="lightbox-count"></span>
    </dialog>
    <dialog id="easter-egg-overlay" class="secret-dialog" aria-labelledby="easter-main-text">
        <img src="imagens/characters/shadow_logo2.png" alt="Super Shadow" width="270" height="117" loading="lazy">
        <h2 id="easter-main-text">Chaos… control!</h2><p id="secret-description"></p>
        <button id="secret-close" class="primary-button">Voltar ao terminal</button>
    </dialog>
